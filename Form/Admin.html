<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Admin Login</title>
  </head>
  <body>
    <div class="container">
      <h1>Admin Login</h1>
      <form class="form">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Email"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Password"
            required
          />
        </div>
        <a href="/Form/Admin.html" class="forgotpass">Forgot Password</a>
        <button class="button">Login</button>
      </form>
    </div>
  </body>
</html>
